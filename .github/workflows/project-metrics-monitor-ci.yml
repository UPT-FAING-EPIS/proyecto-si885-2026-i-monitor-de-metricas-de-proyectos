name: project-metrics-monitor-ci

on:
  push:
    branches: ["main", "master"]
    paths:
      - "project-metrics-monitor/**"
  pull_request:
    paths:
      - "project-metrics-monitor/**"

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-metrics-monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Pytest
        run: pytest

      - name: Validacion ETL offline
        run: python verify.py --offline-sample
