name: etl-scheduled

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      owner:
        description: "Owner de GitHub"
        required: false
        default: "microsoft"
      repos:
        description: "Lista de repositorios separada por comas"
        required: false
        default: "vscode"
      since:
        description: "Timestamp ISO 8601 inicial"
        required: false
        default: "2026-01-01T00:00:00Z"

jobs:
  scheduled-etl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_OWNER: ${{ github.event.inputs.owner || vars.GITHUB_OWNER || 'microsoft' }}
      GITHUB_REPOS: ${{ github.event.inputs.repos || vars.GITHUB_REPOS || 'vscode' }}
      ETL_SINCE: ${{ github.event.inputs.since || vars.ETL_SINCE || '2026-01-01T00:00:00Z' }}
      DB_PATH: database/project_metrics_ci.db
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_ETL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Run ETL scheduled
        run: |
          python -m src.run \
            --owner "${GITHUB_OWNER}" \
            --repos "${GITHUB_REPOS}" \
            --since "${ETL_SINCE}" \
            --db-path "${DB_PATH}" \
            --export-csv \
            --export-parquet \
            --public-export

      - name: Coverage report
        run: coverage report

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-metrics-db
          path: database/*.db

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-metrics-exports
          path: exports/**
