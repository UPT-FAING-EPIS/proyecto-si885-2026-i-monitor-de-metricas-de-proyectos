services:
  - type: worker
    name: project-metrics-monitor-worker
    runtime: python
    plan: starter
    region: oregon
    rootDir: project-metrics-monitor
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python -m src.render_worker
    disk:
      name: project-metrics-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPOS
        sync: false
      - key: ETL_SINCE
        value: 2026-01-01T00:00:00Z
      - key: DB_PATH
        value: storage/project_metrics.db
      - key: EXPORT_DIR
        value: storage/exports
      - key: ETL_INTERVAL_HOURS
        value: "12"
      - key: ETL_RETRY_MINUTES
        value: "15"
      - key: ETL_RUN_ON_START
        value: "true"
      - key: ETL_EXPORT_CSV
        value: "true"
      - key: ETL_EXPORT_PARQUET
        value: "true"
      - key: ETL_PUBLIC_EXPORT
        value: "true"
      - key: GITHUB_TOKEN
        sync: false
