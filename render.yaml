services:
  - type: web
    name: monitor-metricas
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /login
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: SUPABASE_DB_USER
        value: postgres
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: TRELLO_API_KEY
        sync: false
